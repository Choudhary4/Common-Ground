services:
  - type: web
    name: common-ground-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: QR_BASE_URL
        sync: false
      - key: COOKIE_SECRET
        generateValue: true
      - key: SESSION_TTL_HOURS
        value: 72
      - key: SOCIAL_STATUS_TTL_MINUTES
        value: 120
